<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Sejarah Lawatan Sekolah</title>
  
  <!-- PWA & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    header { text-align: center; margin-bottom: 25px; }
    header h1 { margin: 0; color: #2c3e50; font-size: 24px; }
    .subtitle { color: #7f8c8d; font-size: 14px; margin-top: 5px; }
    
    .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #3498db; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .card h3 { margin: 0; font-size: 13px; color: #7f8c8d; }
    .card p { margin: 8px 0 0; font-size: 18px; font-weight: bold; color: #2c3e50; }
    
    .chart-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; height: 260px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #ecf0f1; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: #3498db; color: white; }
    
    .search-box, .form-container { display: flex; gap: 10px; margin-bottom: 20px; }
    
    /* Wrapper untuk kotak carian dan butang X */
    .input-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
    .input-wrapper input { width: 100%; padding: 12px 35px 12px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    
    /* Gaya butang X */
    .clear-btn { position: absolute; right: 10px; background: none; border: none; font-size: 18px; color: #95a5a6; cursor: pointer; display: none; padding: 0; line-height: 1; }
    .clear-btn:hover { color: #e74c3c; }

    .search-box button, .btn-submit { padding: 12px 20px; background: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .search-box button:hover, .btn-submit:hover { background: #2980b9; }
    
    .form-container { flex-direction: column; background: #fdfdfd; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    .school-result-card { background: #fafbfc; border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .analysis-box { background: #e8f4fd; padding: 12px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
    .visit-item { background: white; padding: 10px; border-left: 3px solid #2ecc71; margin-top: 8px; border-radius: 4px; font-size: 13px; }
    .loading { text-align: center; color: #7f8c8d; font-style: italic; margin: 15px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sistem Sejarah Lawatan Sekolah</h1>
      <p class="subtitle">Aplikasi PWA & Pangkalan Data Google Sheet</p>
    </header>

    <!-- Dashboard -->
    <div class="dashboard-cards">
      <div class="card"><h3>Sekolah Unik</h3><p id="dashUniqueSchools">-</p></div>
      <div class="card"><h3>Jumlah Lawatan</h3><p id="dashTotalVisits">-</p></div>
      <div class="card"><h3>Jumlah Jualan</h3><p id="dashTotalSales">-</p></div>
      <div class="card"><h3>Purata Jualan</h3><p id="dashAvgSales">-</p></div>
    </div>

    <!-- Carta -->
    <div class="chart-container">
      <canvas id="salesChart"></canvas>
    </div>

    <!-- Tab Navigasi -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('searchTab', event)">Cari Sekolah</button>
      <button class="tab-btn" onclick="switchTab('addTab', event)">Tambah Rekod Baru</button>
    </div>

    <!-- Carian -->
    <div id="searchTab" class="tab-content">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Taip kata kunci (Cth: SK, KAFA, Paya Salak)..." onkeypress="if(event.key === 'Enter') performSearch()">
        <button type="button" onclick="clearSearch()" style="background: #e74c3c;" title="Kosongkan carian">Padam</button>
        <button onclick="performSearch()">Cari</button>
      </div>
      <div id="loading" class="loading" style="display:none;">Sedang memproses data...</div>
      <div id="searchResult"></div>
    </div>

    <!-- Tambah Rekod -->
    <div id="addTab" class="tab-content" style="display:none;">
      <div class="form-container">
        <h2>Borang Rekod Lawatan</h2>
        <form id="recordForm" onsubmit="submitRecord(event)">
          <div class="form-group"><label>Tarikh:</label><input type="date" id="tarikh" required></div>
          <div class="form-group"><label>Nama Sekolah:</label><input type="text" id="namaSekolah" placeholder="Nama penuh sekolah" required></div>
          <div class="form-group"><label>Jumlah Pelajar:</label><input type="number" id="jumlahPelajar" placeholder="Cth: 200" required></div>
          <div class="form-group"><label>Jumlah Jualan (RM):</label><input type="number" step="0.01" id="jumlahJualan" placeholder="Cth: 2500.00" required></div>
          <button type="submit" class="btn-submit">Simpan Rekod</button>
        </form>
        <div id="formMessage" style="margin-top: 10px; font-weight: bold;"></div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "MASUKKAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI";

    window.onload = function() {
      loadDashboard();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      }
    };

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      evt.currentTarget.classList.add('active');
    }

    // Fungsi Papar/Sembunyi Butang X
    function toggleClearButton() {
      let input = document.getElementById('searchInput');
      let clearBtn = document.getElementById('clearBtn');
      if (input.value.length > 0) {
        clearBtn.style.display = 'block';
      } else {
        clearBtn.style.display = 'none';
      }
    }

    // Fungsi Kosongkan Ruang Carian
    function clearSearch() {
      let input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('searchResult').innerHTML = '';
      input.focus();
    }

    function loadDashboard() {
      fetch(GAS_URL + '?action=getDashboard')
        .then(res => res.json())
        .then(stats => {
          document.getElementById('dashUniqueSchools').innerText = stats.jumlahSekolahUnik;
          document.getElementById('dashTotalVisits').innerText = stats.jumlahLawatan;
          document.getElementById('dashTotalSales').innerText = 'RM ' + stats.jumlahKeseluruhanJualan;
          document.getElementById('dashAvgSales').innerText = 'RM ' + stats.purataJualan;
          renderSalesChart(stats.topSchools);
        })
        .catch(err => console.error('Ralat Dashboard:', err));
    }

    function renderSalesChart(topSchools) {
      let ctx = document.getElementById('salesChart').getContext('2d');
      let labels = topSchools ? topSchools.map(item => item.name) : [];
      let dataVals = topSchools ? topSchools.map(item => item.sales) : [];
      
      if (window.mySalesChart) window.mySalesChart.destroy();
      
      window.mySalesChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Jumlah Jualan (RM)',
            data: dataVals,
            backgroundColor: 'rgba(52, 152, 219, 0.75)',
            borderColor: 'rgba(41, 128, 185, 1)',
            borderWidth: 1,
            borderRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, title: { display: true, text: 'Top 5 Sekolah Prestasi Jualan Tertinggi' } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function performSearch() {
      let query = document.getElementById('searchInput').value.trim();
      if (!query) { alert('Sila masukkan kata kunci carian.'); return; }
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('searchResult').innerHTML = '';

      fetch(GAS_URL + '?action=search&query=' + encodeURIComponent(query))
        .then(res => res.json())
        .then(res => {
          document.getElementById('loading').style.display = 'none';
          let resultDiv = document.getElementById('searchResult');
          
          if (!res.found) {
            resultDiv.innerHTML = `<p class="loading">${res.message}</p>`;
            return;
          }

          let html = `<p>Ditemui <strong>${res.count}</strong> sekolah sepadan:</p>`;
          res.schools.forEach(school => {
            html += `<div class="school-result-card">`;
            html += `<h2>${school.schoolName}</h2>`;
            html += `<div class="analysis-box">`;
            html += `<p><strong>Bilangan Lawatan:</strong> ${school.stats.totalVisits}</p>`;
            html += `<p><strong>Jumlah Jualan:</strong> RM ${school.stats.totalSales}</p>`;
            html += `<p><strong>Purata Jualan:</strong> RM ${school.stats.avgSales}</p>`;
            html += `</div>`;
            html += `<h3>Sejarah Lawatan</h3>`;
            school.records.forEach((rec, index) => {
              html += `<div class="visit-item">`;
              html += `<p><strong>Lawatan ${index + 1} (${rec.tarikh}):</strong> Pelajar: ${rec.jumlahPelajar} | Jualan: RM ${rec.jumlahJualan.toFixed(2)}</p>`;
              html += `</div>`;
            });
            html += `</div>`;
          });
          resultDiv.innerHTML = html;
        })
        .catch(err => {
          document.getElementById('loading').style.display = 'none';
          alert('Ralat rangkaian semasa mencari.');
        });
    }

    function submitRecord(e) {
      e.preventDefault();
      let payload = {
        tarikh: document.getElementById('tarikh').value,
        namaSekolah: document.getElementById('namaSekolah').value,
        jumlahPelajar: document.getElementById('jumlahPelajar').value,
        jumlahJualan: document.getElementById('jumlahJualan').value
      };

      let msgDiv = document.getElementById('formMessage');
      msgDiv.innerHTML = "Sedang menyimpan...";
      msgDiv.style.color = "#3498db";

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          msgDiv.innerHTML = res.message;
          msgDiv.style.color = "green";
          document.getElementById('recordForm').reset();
          loadDashboard();
        } else {
          msgDiv.innerHTML = res.message;
          msgDiv.style.color = "red";
        }
      })
      .catch(err => {
        msgDiv.innerHTML = "Ralat menyimpan rekod.";
        msgDiv.style.color = "red";
      });
    }
  </script>
</body>
</html>
